name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KPF_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/knowledge
      KPF_MIGRATION_TEST_USERNAME: knowledge
      KPF_MIGRATION_TEST_PASSWORD: knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t knowledge-profiling-backend:ci .
      - run: docker build -f frontend/Dockerfile -t knowledge-profiling-frontend:ci ./frontend
      - run: docker compose config --quiet
