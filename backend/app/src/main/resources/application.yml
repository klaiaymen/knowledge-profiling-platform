spring:
  application:
    name: knowledge-profiling-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    default: ollama
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${DATABASE_USERNAME:knowledge}
    password: ${DATABASE_PASSWORD:knowledge}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
app:
  jwt:
    secret: ${KPF_JWT_SECRET:}
    issuer: ${KPF_JWT_ISSUER:knowledge-profiling-platform}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  docs:
    path: ${KPF_DOCS_PATH:docs/sources}
  github:
    token: ${GITHUB_TOKEN:}
    repository: ${KPF_GITHUB_REPOSITORY:}
  traceability:
    github:
      api-url: ${GITHUB_API_URL:https://api.github.com}
    jira:
      enabled: ${JIRA_ENABLED:false}
    generated-docs: ${KPF_GENERATED_DOCS:docs/generated}
  profiling:
    regulation-path: ${KPF_REGULATION_PATH:data/regulation}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.55}
server:
  error:
    include-message: never
